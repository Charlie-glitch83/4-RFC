name: Advance verified AUTH-020

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy networkx
      - name: Advance AUTH-020 exactly once
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE=$(python -c "import json; print(json.load(open('STATE.json'))['active_work_unit'])")
          if [ "$ACTIVE" != "AUTH-020" ]; then
            echo "Already advanced to $ACTIVE"
            exit 0
          fi
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          runs=json.load(open('memory/RUN_INDEX.json')).get('runs',[])
          if s.get('current_run') is not None:
              raise SystemExit('AUTH current_run must be null before advancement')
          if not any(r.get('run_id')=='AUTH-020-20260811T044245Z' and r.get('status')=='PASS' for r in runs):
              raise SystemExit('AUTH PASS run not registered')
          PY
          python tools/rfc.py record-commit 27b250a0d70f429b59184dfc01b2a812cff26d45 --branch agent/4rfc-universe-build --note 'Externally verified AUTH-020 scientific-constitution lock commit and diff.'
          python tools/rfc.py advance --task AUTH-020 --result PASS --evidence runs/AUTH-020-20260811T044245Z/CLOSEOUT.md
          bash tools/start_work.sh
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/auth020-transition.yml' ':!.github/workflows/src010-governed.yml' ':!.github/workflows/4rfc-boot-transition.yml'
          git commit -m 'Advance governed queue after AUTH-020'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
