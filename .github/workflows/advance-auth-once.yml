name: One-shot AUTH advance

on:
  push:
    branches: [agent/4rfc-universe-build]
    paths:
      - .github/workflows/advance-auth-once.yml

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install numpy scipy sympy networkx
      - name: Verify AUTH and advance exactly one child
        shell: bash
        run: |
          set -euo pipefail
          test "$(python - <<'PY'
          import json
          print(json.load(open('STATE.json'))['active_work_unit'])
          PY
          )" = "AUTH-020"
          python - <<'PY'
          import json
          idx=json.load(open('memory/RUN_INDEX.json')).get('runs',[])
          runs=[r for r in idx if r.get('task_id')=='AUTH-020' and r.get('status')=='PASS']
          assert runs, 'AUTH-020 has no closed PASS run'
          print(runs[-1]['run_id'])
          PY
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          SHA=$(git rev-parse HEAD)
          python tools/rfc.py record-commit "$SHA" --branch agent/4rfc-universe-build --note 'Verified AUTH-020 branch head, closed PASS run, full tests, director, doctor and firewall before advancement.'
          RUN=$(python - <<'PY'
          import json
          idx=json.load(open('memory/RUN_INDEX.json')).get('runs',[])
          print([r['run_id'] for r in idx if r.get('task_id')=='AUTH-020' and r.get('status')=='PASS'][-1])
          PY
          )
          python tools/rfc.py advance --task AUTH-020 --result PASS --evidence "runs/$RUN/CLOSEOUT.md"
          bash tools/start_work.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/advance-auth-once.yml' ':!.github/workflows/src010-governed.yml'
          git commit -m 'Advance governed queue after AUTH-020'
          git push origin HEAD:agent/4rfc-universe-build
# one-shot trigger
