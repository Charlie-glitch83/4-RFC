name: Governed Active Module Step

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repository-step:
    if: github.event.pull_request.head.ref == 'agent/4rfc-universe-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy networkx scipy sympy
      - name: Finalize and close B-110 through repository commands
        shell: bash
        run: |
          set -euo pipefail
          RUN='B-110-20260811T140258Z'
          RUN_DIR="modules/B/runs/$RUN"
          python "$RUN_DIR/B110_VERIFY.py"
          python "$RUN_DIR/B110_FINALIZE.py"
          python tools/rfc.py promote-module B --to FORMALIZED --fidelity MINIMAL_SPINE --evidence "$RUN_DIR/PRE_EXECUTION_LOCK.json"
          python tools/rfc.py promote-module B --to IMPLEMENTED --fidelity MINIMAL_SPINE --evidence "$RUN_DIR/solver_configs/B_big_implosion.json"
          python tools/rfc.py promote-module B --to VERIFIED --fidelity MINIMAL_SPINE --evidence "$RUN_DIR/GATE_RESULTS.json"
          python tools/rfc.py promote-module B --to PHYSICALLY_EXECUTED --fidelity MINIMAL_SPINE --evidence "$RUN_DIR/FIRST_PHYSICAL_STATE.json"
          python tools/rfc.py promote-module B --to INDEPENDENTLY_REPRODUCED --fidelity MINIMAL_SPINE --evidence "$RUN_DIR/INDEPENDENT_VERIFICATION.md"
          python tools/rfc.py promote-module B --to FROZEN --fidelity MINIMAL_SPINE --evidence "$RUN_DIR/H_B_to_C.json"
          python tools/rfc.py record-claim --file "$RUN_DIR/CLAIM_RECORD.json"
          python tools/rfc.py close-run --run-id "$RUN" --result PASS --closeout "$RUN_DIR/CLOSEOUT.md"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit closed B-110
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Close Module B at its verified scientific scope'
          git fetch origin agent/4rfc-universe-build
          git rebase origin/agent/4rfc-universe-build
          git push origin HEAD:agent/4rfc-universe-build
