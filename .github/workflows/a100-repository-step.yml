name: A100 Repository Step

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repository-step:
    if: github.event.pull_request.head.ref == 'agent/4rfc-universe-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy networkx scipy
      - name: Run exact repository commands
        shell: bash
        run: |
          set -euo pipefail
          RUN='A-100-20260811T115001Z'
          python tools/director.py wolfram-record --run "$RUN" --call A-WL-001 --output "modules/A/runs/$RUN/wolfram_raw/A-WL-001.recorder.txt"
          python tools/director.py wolfram-record --run "$RUN" --call A-WL-002 --output "modules/A/runs/$RUN/wolfram_raw/A-WL-002.recorder.txt"
          python tools/run_reference_checks.py --module A --output "modules/A/runs/$RUN/reference_checks.json"
          python tools/director.py doctor
      - name: Commit repository-produced records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/A/runs/A-100-20260811T115001Z
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A-100: record Wolfram and reference checks'
          git push origin HEAD:agent/4rfc-universe-build
