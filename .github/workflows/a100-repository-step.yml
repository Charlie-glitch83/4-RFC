name: Governed Active Module Step

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repository-step:
    if: github.event.pull_request.head.ref == 'agent/4rfc-universe-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy networkx scipy sympy
      - name: Verify B-110 closeout and advance exactly one child
        shell: bash
        run: |
          set -euo pipefail
          RUN='B-110-20260811T140258Z'
          RUN_DIR="modules/B/runs/$RUN"
          VERIFIED_SHA='32a2190520fd3d547fcdac57a31b082788220afc'
          python tools/rfc.py record-commit "$VERIFIED_SHA" --branch agent/4rfc-universe-build --note 'Verified B-110 closeout commit and exact diff'
          python tools/rfc.py advance --task B-110 --result PASS --evidence "$RUN_DIR/CLOSEOUT.md"
          bash tools/start_work.sh
          cat work_packets/ACTIVE_WORK_PACKET.md
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit B-110 transition and prepared child packet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Advance from frozen Module B to its authorized child'
          git fetch origin agent/4rfc-universe-build
          git rebase origin/agent/4rfc-universe-build
          git push origin HEAD:agent/4rfc-universe-build
