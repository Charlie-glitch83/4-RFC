name: Governed REC-040 controller invocation

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  invoke:
    if: github.event.pull_request.head.ref == 'agent/rec040-repository-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy networkx
      - name: Return verified REC-040 closeout to repository controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c "import json; print(json.load(open('STATE.json'))['active_work_unit'])")" = "REC-040"
          test "$(python -c "import json; print(json.load(open('STATE.json'))['current_run'])")" = "None"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py record-commit d79e18a736ef6f061b2dc79a6080d225a0ab67dc --branch agent/4rfc-universe-build --note 'Externally verified closed REC-040 run commit and diff.'
          python tools/rfc.py advance --task REC-040 --result PASS --evidence runs/REC-040-20260811T045909Z/CLOSEOUT.md
          bash tools/start_work.sh
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Advance governed queue after REC-040'
          git push origin HEAD:agent/4rfc-universe-build
