name: Advance verified XWALK-030

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy networkx
      - name: Verify XWALK and advance one child
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c "import json; print(json.load(open('STATE.json'))['active_work_unit'])")" = "XWALK-030"
          test "$(python -c "import json; print(json.load(open('STATE.json'))['current_run'])")" = "None"
          python - <<'PY'
          import json
          rows=json.load(open('memory/RUN_INDEX.json')).get('runs',[])
          rs=[r for r in rows if r.get('task_id')=='XWALK-030' and r.get('status')=='PASS']
          assert rs, 'XWALK-030 has no closed PASS run'
          print(rs[-1]['run_id'])
          PY
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          VERIFIED=143cb9e8ae72e0c3f0017d015195b367947b0e33
          python tools/rfc.py record-commit "$VERIFIED" --branch agent/4rfc-universe-build --note 'Externally fetched XWALK-030 commit; 16-object crosswalk, source hashes, independent review and component gates verified before advancement.'
          RUN=$(python - <<'PY'
          import json
          rows=json.load(open('memory/RUN_INDEX.json')).get('runs',[])
          print([r['run_id'] for r in rows if r.get('task_id')=='XWALK-030' and r.get('status')=='PASS'][-1])
          PY
          )
          python tools/rfc.py advance --task XWALK-030 --result PASS --evidence "runs/$RUN/CLOSEOUT.md"
          bash tools/start_work.sh
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows/*.yml'
          git commit -m 'Advance governed queue after XWALK-030'
          git push origin HEAD:agent/4rfc-universe-build
