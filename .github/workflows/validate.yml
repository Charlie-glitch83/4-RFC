name: Validate 3-RFC Repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/rfc.py doctor
      - run: python -m unittest discover -s tests -v
      - run: python tools/rfc.py firewall-scan
