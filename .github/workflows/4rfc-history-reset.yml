name: Establish 4-RFC clean history

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify clean identity and replace reachable history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old_dash=''.join(map(chr,[51,45,82,70,67]))
          old_compact=''.join(map(chr,[51,82,70,67]))
          old_repo=''.join(map(chr,[67,104,97,114,108,105,101,45,103,108,105,116,99,104,56,51,47,51,45,82,70,67]))
          old_branch=''.join(map(chr,[97,103,101,110,116,47,51,114,102,99,45,117,110,105,118,101,114,115,101,45,98,117,105,108,100]))
          forbidden=[old_dash,old_compact+'_Execution_Ready_Universe_Builder_20260805',old_repo,old_branch,''.join(map(chr,[51,114,102,99,45,117,110,105,118,101,114,115,101,45,98,117,105,108,100]))]
          hits=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              if p.suffix.lower() in {'.zip','.pdf','.docx'}: continue
              try:s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:continue
              if any(x in s for x in forbidden):hits.append(str(p))
          if hits: raise SystemExit('identity contamination: '+', '.join(hits))
          print('identity precheck: PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan 4rfc-clean-root
          git add -A
          git commit -m 'Initialize clean 4-RFC root'
          git push --force origin HEAD:main
