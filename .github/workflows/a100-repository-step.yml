name: Governed Active Module Step

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repository-step:
    if: github.event.pull_request.head.ref == 'agent/4rfc-universe-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy networkx scipy sympy
      - name: Rerun full frozen C-120 matrix after deterministic eigenvector correction
        shell: bash
        run: |
          set -euo pipefail
          RUN='C-120-20260811T142152Z'
          RUN_DIR="modules/C/runs/$RUN"
          bash tools/start_work.sh
          grep -q 'ACTIVE WORK PACKET — C-120' work_packets/ACTIVE_WORK_PACKET.md
          python "$RUN_DIR/C120_PREPARE_BINDINGS.py"
          python tools/director.py wolfram-record --run "$RUN" --call C-WL-001 --output "$RUN_DIR/wolfram_raw/C-WL-001.recorder.txt"
          python tools/director.py wolfram-record --run "$RUN" --call C-WL-002 --output "$RUN_DIR/wolfram_raw/C-WL-002.recorder.txt"
          python tools/run_reference_checks.py --module C --output "$RUN_DIR/reference_checks.json"
          python tools/materialize_solver_config.py --template "$RUN_DIR/solver_templates/C_spectral_model.template.json" --binding-sheet "$RUN_DIR/binding_sheets/C_spectral_model.bindings.json" --output "$RUN_DIR/solver_configs/C_spectral_model.json"
          python tools/run_configured_solver.py --config "$RUN_DIR/solver_configs/C_spectral_model.json" --output-dir "$RUN_DIR/solver_outputs/spectral_model"
          python "$RUN_DIR/C120_VERIFY.py"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit corrected full C-120 verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'C-120: rerun frozen microscopic matrix deterministically'
          git fetch origin agent/4rfc-universe-build
          git rebase origin/agent/4rfc-universe-build
          git push origin HEAD:agent/4rfc-universe-build
