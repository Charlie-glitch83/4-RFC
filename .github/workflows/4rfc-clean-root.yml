name: Establish clean 4-RFC root

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/4rfc-clean-root.yml

permissions:
  contents: write

jobs:
  clean-root:
    runs-on: ubuntu-latest
    steps:
      - name: Check out 4-RFC
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebind repository identity and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          old_archive = ''.join(map(chr,[51,82,70,67,95])) + 'Execution_Ready_Universe_Builder_20260805.zip'
          for name in [old_archive, old_archive + '.sha256']:
              p = root / name
              if p.exists():
                  p.unlink()
          old_repo = ''.join(map(chr,[67,104,97,114,108,105,101,45,103,108,105,116,99,104,56,51,47,51,45,82,70,67]))
          old_branch = ''.join(map(chr,[97,103,101,110,116,47,51,114,102,99,45,117,110,105,118,101,114,115,101,45,98,117,105,108,100]))
          old_bundle = ''.join(map(chr,[51,82,70,67])) + '_Execution_Ready_Universe_Builder_20260805'
          old_dash = ''.join(map(chr,[51,45,82,70,67]))
          old_compact = ''.join(map(chr,[51,82,70,67]))
          old_lower = ''.join(map(chr,[51,114,102,99]))
          replacements = [
              (old_repo, 'Charlie-glitch83/4-RFC'),
              (old_branch, 'agent/4rfc-universe-build'),
              (old_bundle, '4RFC_Execution_Ready_Universe_Builder_20260805'),
              (old_dash, '4-RFC'),
              (old_compact, '4RFC'),
              (old_lower, '4rfc'),
          ]
          changed = 0
          for p in sorted(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts:
                  continue
              if p.suffix.lower() in {'.zip', '.pdf', '.docx'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for a, b in replacements:
                  new = new.replace(a, b)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed += 1
          print(f'identity files rewritten: {changed}')
          PY
          python tools/build_bundle.py
          python tools/rfc.py verify-bundle
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan

      - name: Prove legacy repository identity is absent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          import io, re
          root = Path('.')
          forbidden_text = [
              ''.join(map(chr,[51,45,82,70,67])),
              ''.join(map(chr,[51,82,70,67])),
              ''.join(map(chr,[51,114,102,99])),
              ''.join(map(chr,[67,104,97,114,108,105,101,45,103,108,105,116,99,104,56,51,47,51,45,82,70,67])),
              ''.join(map(chr,[97,103,101,110,116,47,51,114,102,99])),
          ]
          bad = []
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              rel = p.as_posix()
              if any(x.lower() in rel.lower() for x in forbidden_text):
                  bad.append('path:' + rel)
              if p.suffix.lower() in {'.zip', '.pdf', '.docx'}:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if any(x in s for x in forbidden_text):
                  bad.append('text:' + rel)
          def scan_zip(data, label, depth=0):
              if depth > 8:
                  return
              try:
                  z = ZipFile(io.BytesIO(data))
              except BadZipFile:
                  return
              for zi in z.infolist():
                  if any(x.lower() in zi.filename.lower() for x in forbidden_text):
                      bad.append('zip-path:' + label + '!' + zi.filename)
                  if zi.is_dir():
                      continue
                  data2 = z.read(zi)
                  low = data2.lower()
                  for x in forbidden_text:
                      if x.encode().lower() in low:
                          bad.append('zip-data:' + label + '!' + zi.filename)
                          break
                  if data2[:4] == b'PK\x03\x04':
                      scan_zip(data2, label + '!' + zi.filename, depth + 1)
          for p in root.rglob('*.zip'):
              if '.git' not in p.parts:
                  scan_zip(p.read_bytes(), p.as_posix())
          if bad:
              raise SystemExit('legacy identity remains:\n' + '\n'.join(bad))
          print('legacy identity scan: PASS')
          PY

      - name: Replace branch history with clean 4-RFC root
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/4rfc-clean-root.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan 4rfc-clean-root
          git add -A
          git commit -m "Initialize the 4-RFC governed universe workspace"
          git push --force origin HEAD:main
