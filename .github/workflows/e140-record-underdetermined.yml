name: Record E-140 Underdetermination

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  record-e140-stop:
    if: github.event.pull_request.head.ref == 'agent/4rfc-universe-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy networkx scipy sympy
      - name: Record exact E-140 prelock hard stop
        shell: bash
        run: |
          set -euo pipefail
          RUN='E-140-20260811T175023Z'
          AUDIT="modules/E/runs/$RUN/E140_SOURCE_ADMISSION_AUDIT.json"
          bash tools/start_work.sh
          grep -q 'ACTIVE WORK PACKET — E-140' work_packets/ACTIVE_WORK_PACKET.md
          grep -q 'REQUIRES_EXACT_SOURCE_OWNED_SPECIES_STOICHIOMETRY_AND_RATE_LAWS_BEFORE_FREEZE' "$AUDIT"
          grep -q '"status": "DRAFT"' "modules/E/runs/$RUN/PRE_EXECUTION_LOCK.json"
          python tools/rfc.py advance --task E-140 --result FAIL --evidence "$AUDIT" --note 'BLOCKED_UNDERDETERMINED: admitted E-relevant sources do not provide an exact source-owned executable species set, stoichiometric reaction graph, and reaction rate laws. Old W2/X1 abundance proxy outcomes and solver examples are non-generative and were not used. Pre-execution lock remains DRAFT; no E Wolfram call or reaction solver is authorized.'
          python tools/rfc.py doctor
          python tools/director.py doctor
          python tools/rfc.py firewall-scan
      - name: Commit governed stop evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore memory/CURRENT_CONTEXT.md || true
          git add STATE.json WORK_QUEUE.json memory/FAILURE_LOG.jsonl work_packets/ACTIVE_WORK_PACKET.md || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'E-140: preserve underdetermined nuclear-network stop'
          git fetch origin agent/4rfc-universe-build
          git rebase origin/agent/4rfc-universe-build
          git push origin HEAD:agent/4rfc-universe-build
