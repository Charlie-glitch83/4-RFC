name: Advance verified AUTH-020

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy networkx
      - name: Reconcile final AUTH bundle and advance exactly once
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE=$(python -c "import json; print(json.load(open('STATE.json'))['active_work_unit'])")
          if [ "$ACTIVE" != "AUTH-020" ]; then
            echo "Already advanced to $ACTIVE"
            exit 0
          fi
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path('.')
          run=root/'runs/AUTH-020-20260811T044245Z'
          def file_hash(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          h=hashlib.sha256()
          for p in sorted(run.rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(root)
              if any(part in {'.git','__pycache__','runtime_cache','scratch'} for part in rel.parts): continue
              h.update(str(rel).encode()); h.update(b'\0'); h.update(file_hash(p).encode()); h.update(b'\n')
          digest=h.hexdigest()
          idx=json.load(open('memory/RUN_INDEX.json'))
          recs=[r for r in idx.get('runs',[]) if r.get('run_id')=='AUTH-020-20260811T044245Z']
          if len(recs)!=1 or recs[0].get('status')!='PASS': raise SystemExit('AUTH PASS run registration missing or ambiguous')
          recs[0]['tree_sha256']=digest
          Path('memory/RUN_INDEX.json').write_text(json.dumps(idx,indent=2)+'\n')
          reg=json.load(open('memory/ARTIFACT_REGISTRY.json'))
          arts=[a for a in reg.get('artifacts',[]) if a.get('kind')=='RUN_BUNDLE' and a.get('run_id')=='AUTH-020-20260811T044245Z']
          if len(arts)!=1: raise SystemExit('AUTH run artifact registration missing or ambiguous')
          arts[0]['sha256']=digest
          Path('memory/ARTIFACT_REGISTRY.json').write_text(json.dumps(reg,indent=2)+'\n')
          print('reconciled AUTH final run hash:',digest)
          PY
          python tools/rfc.py doctor
          python tools/director.py doctor
          python tools/rfc.py record-commit 27b250a0d70f429b59184dfc01b2a812cff26d45 --branch agent/4rfc-universe-build --note 'Externally verified AUTH-020 scientific-constitution lock commit and diff; final run-bundle hash reconciled after required external verification record.'
          python tools/rfc.py advance --task AUTH-020 --result PASS --evidence runs/AUTH-020-20260811T044245Z/CLOSEOUT.md
          bash tools/start_work.sh
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/auth020-transition.yml'
          git commit -m 'Advance governed queue after AUTH-020'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
