name: Record E-140 Underdetermination Stop

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  record-e140-stop:
    if: github.event.pull_request.head.ref == 'agent/4rfc-universe-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record exact E-140 hard stop
        shell: bash
        run: |
          set -euo pipefail
          RUN='E-140-20260811T175023Z'
          RUN_DIR="modules/E/runs/$RUN"
          bash tools/start_work.sh
          grep -q 'ACTIVE WORK PACKET — E-140' work_packets/ACTIVE_WORK_PACKET.md
          grep -q '"status": "BLOCKED_UNDERDETERMINED"' "$RUN_DIR/E140_SOURCE_ADMISSION_AUDIT.json"
          grep -q '"status": "DRAFT"' "$RUN_DIR/PRE_EXECUTION_LOCK.json"
          test ! -e "$RUN_DIR/solver_configs/E_reaction_network.json"
          python tools/rfc.py advance --task E-140 --result FAIL --evidence "$RUN_DIR/E140_SOURCE_ADMISSION_AUDIT.json" --note 'BLOCKED_UNDERDETERMINED: exact admitted parent/source bytes do not determine the executable primordial species graph, stoichiometry, source-owned reaction-rate laws/uncertainties, isotope mapping, or physical rate clock required to freeze Module E. No familiar/default/public BBN rates or abundance targets may be inserted.'
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          grep -q '"active_work_unit": "E-140"' STATE.json
          grep -q '"project_status": "FAIL_REQUIRES_ANALYSIS"' STATE.json
      - name: Commit governed E-140 stop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add STATE.json WORK_QUEUE.json memory/FAILURE_LOG.jsonl memory/CURRENT_CONTEXT.md work_packets/ACTIVE_WORK_PACKET.md modules/E/runs/E-140-20260811T175023Z/E140_SOURCE_ADMISSION_AUDIT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'E-140: record blocked underdetermined source law'
          git fetch origin agent/4rfc-universe-build
          git rebase origin/agent/4rfc-universe-build
          git push origin HEAD:agent/4rfc-universe-build
