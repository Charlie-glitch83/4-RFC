name: Advance verified XWALK-030

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy sympy networkx
      - name: Advance XWALK-030 exactly once
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE=$(python -c "import json; print(json.load(open('STATE.json'))['active_work_unit'])")
          if [ "$ACTIVE" != "XWALK-030" ]; then
            echo "Already advanced to $ACTIVE"
            exit 0
          fi
          python tools/rfc.py doctor
          python tools/director.py doctor
          python tools/rfc.py record-commit 143cb9e8ae72e0c3f0017d015195b367947b0e33 --branch agent/4rfc-universe-build --note 'Externally verified XWALK-030 enhancement-crosswalk commit and diff.'
          python tools/rfc.py advance --task XWALK-030 --result PASS --evidence runs/XWALK-030-20260811T045240Z/CLOSEOUT.md
          bash tools/start_work.sh
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/auth020-transition.yml'
          git commit -m 'Advance governed queue after XWALK-030'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
