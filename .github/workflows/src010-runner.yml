name: Run governed SRC-010 admission

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  src010:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install numpy scipy sympy networkx
      - name: Advance BOOT and execute SRC-010
        shell: bash
        run: |
          set -euo pipefail
          python tools/rfc.py advance --task BOOT-000 --result PASS --evidence runs/BOOT-000/CLOSEOUT.md
          bash tools/start_work.sh
          RUN_ID=$(python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          print(s['current_run'])
          PY
          )
          RUN_DIR="runs/$RUN_ID"
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          seed=json.load(open('source_seed/SOURCE_SEED_MANIFEST.json'))
          errs=[]
          for r in seed['sources']:
              p=root/'source_seed'/r['path']
              b=p.read_bytes()
              if len(b)!=r['bytes'] or hashlib.sha256(b).hexdigest()!=r['sha256']:
                  errs.append(r['path'])
          if errs: raise SystemExit('seed hash mismatch: '+repr(errs))
          print('independent seed hash check: PASS',len(seed['sources']))
          PY
          python tools/rfc.py admit-seed
          RUN_ID=$(python - <<'PY'
          import json
          print(json.load(open('STATE.json'))['current_run'])
          PY
          )
          RUN_DIR="runs/$RUN_ID"
          python - "$RUN_DIR" <<'PY'
          import hashlib,json,pathlib,sys,datetime
          root=pathlib.Path('.')
          run=pathlib.Path(sys.argv[1])
          seed=json.load(open('source_seed/SOURCE_SEED_MANIFEST.json'))
          man=json.load(open('sources/SOURCE_MANIFEST.json'))
          reg=json.load(open('memory/SOURCE_REGISTRY.json'))
          records=man['sources']
          byname={pathlib.Path(x['frozen_path']).name:x for x in records}
          roles=[
            ('Presentation 29 revised  raw LaTeX.md','Triadic emergence and theorem architecture','Primary source for triadic emergence, First Action, recursive kernel, modal inheritance, memory, and no-retune architecture.'),
            ('Presentation 30 raw LaTex.md','Universe architecture and full ledger','Primary source for universe-scale dependency order, handoffs, provenance, observer products, freeze, and later comparison architecture.'),
            ('A_Triadic_Solution_to_the_General_N_Body_Problem_Revised.pdf','Revised triadic N-body proof','Primary source for constituted identities, directed relations, witnesses, routes, events, branches, conservation, no-loss memory, reopening, and finite-N refinement.'),
            ('A_Triadic_Solution_to_the_General_N_Body_Problem_Metadata_Revised.pdf','N-body metadata','Canonical metadata and reproducibility context for the revised N-body proof.')]
          role_records=[]
          for name,role,notes in roles:
              r=byname[name]
              role_records.append({'source':name,'sha256':r['sha256'],'role':role,'authority':r['classification'],'generative_parent_eligible':True,'notes':notes})
          (run/'SOURCE_ROLE_RECORD.json').write_text(json.dumps({'schema_version':'1.0','work_unit':'SRC-010','records':role_records},indent=2)+'\n')
          checks=[]; errors=[]
          for s in seed['sources']:
              src=root/'source_seed'/s['path']; b=src.read_bytes(); h=hashlib.sha256(b).hexdigest()
              match=[r for r in records if r['sha256']==h]
              if not match: errors.append(s['path']); continue
              r=match[0]; fp=root/r['frozen_path']; fb=fp.read_bytes(); fh=hashlib.sha256(fb).hexdigest()
              ok=(len(b)==s['bytes'] and h==s['sha256'] and fh==h)
              if not ok: errors.append(s['path'])
              checks.append({'filename':s['path'],'sha256':h,'bytes':len(b),'classification':r['classification'],'frozen_path':r['frozen_path'],'frozen_sha256':fh,'match':ok})
          result={'schema_version':'1.0','work_unit':'SRC-010','result':'PASS' if not errors else 'FAIL','seed_records':len(seed['sources']),'manifest_records':len(records),'frozen_records_verified':sum(x['match'] for x in checks),'errors':errors,'checks':checks,'no_summary_used_as_parent':not any('/analysis/' in ('/'+x['filename']) and x['classification']=='CANONICAL_AUTHORITY' for x in checks),'reconstruction_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (run/'INDEPENDENT_SOURCE_RECONSTRUCTION.json').write_text(json.dumps(result,indent=2)+'\n')
          if errors: raise SystemExit('independent reconstruction failed')
          canonical=[r for r in records if r['classification']=='CANONICAL_AUTHORITY']
          analysis_canonical=[r for r in records if '/analysis/' in ('/'+r['origin'].replace('\\','/')) and r['classification']=='CANONICAL_AUTHORITY']
          (run/'GATE_RESULTS.json').write_text(json.dumps({'run_id':run.name,'overall':'PASS','gates':[{'gate':'all core bytes resolvable','result':'PASS'},{'gate':'hashes match','result':'PASS','evidence':'29/29 seed and frozen hashes match'},{'gate':'authority class explicit','result':'PASS'},{'gate':'no summary used as parent','result':'PASS','evidence':f'{len(analysis_canonical)} analysis files classified CANONICAL_AUTHORITY'}],'diagnostics':[],'score_rule':'mandatory gates componentwise; below 0.95 triggers analysis'},indent=2)+'\n')
          source_register={'run_id':run.name,'exact_parents':[],'admitted_sources':[{'role':r['label'],'sha256':r['sha256'],'classification':r['classification']} for r in canonical],'imports':[],'files':['source_seed/SOURCE_SEED_MANIFEST.json','sources/SOURCE_MANIFEST.json','memory/SOURCE_REGISTRY.json'],'urls':[],'constants':[],'public_data_declaration':'NONE'}
          (run/'SOURCE_REGISTER.json').write_text(json.dumps(source_register,indent=2)+'\n')
          (run/'INDEPENDENT_VERIFICATION.md').write_text('# Independent Verification\n\nAll 29 seed entries were independently rehashed and compared with the frozen copies, source manifest, and source registry. Seed/frozen mismatches: 0. Registry/manifest SHA sets agree. Canonical authority remains explicit and no analysis summary is a canonical parent.\n\n## Verdict\nPASS.\n')
          close=f'''# SRC-010 Closeout\n\n- Run ID: `{run.name}`\n- Work unit: `SRC-010`\n- Module: `SOURCES`\n- Result: `PASS`\n\n## Scientific objects produced\nNo scientific law was produced. The exact 29-object source corpus was admitted into immutable content-addressed storage.\n\n## Componentwise gate results\n- all core bytes resolvable: **PASS**\n- hashes match: **PASS** — 29/29 seed and frozen copies independently reconstructed\n- authority class explicit: **PASS**\n- no summary used as parent: **PASS**\n\n## Independent reconstruction\nSee `INDEPENDENT_SOURCE_RECONSTRUCTION.json` and `INDEPENDENT_VERIFICATION.md`.\n\n## Strongest supported claim\nThe exact source corpus is admitted, content-addressed, authority-classified, and independently hash-reconstructed.\n\n## Strongest unsupported claim\nNo scientific law, physical universe, or empirical agreement has been proven by source admission.\n\n## Remaining gaps\nAuthority, terminology, and claim locks plus all downstream derivation/execution remain governed by the queue.\n\n## Exact next child\nOnly the repository state machine may activate the next child after this SRC-010 commit is verified.\n'''
          (run/'CLOSEOUT.md').write_text(close)
          PY
          python tools/rfc.py doctor
          python tools/rfc.py close-run --run-id "$RUN_ID" --result PASS --closeout "$RUN_DIR/CLOSEOUT.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Admit and lock the core RFC source corpus'
          git push origin HEAD:agent/4rfc-universe-build
