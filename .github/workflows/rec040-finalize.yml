name: Invoke 4-RFC controller for REC-040

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  invoke-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository test dependencies
        run: python -m pip install numpy scipy sympy networkx
      - name: Let the repository validate and close REC-040
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c "import json; print(json.load(open('STATE.json'))['active_work_unit'])")" = "REC-040"
          test "$(python -c "import json; print(json.load(open('STATE.json'))['current_run'])")" = "REC-040-20260811T045909Z"

          bash tools/start_work.sh
          python tools/director.py doctor
          python tools/rfc.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan

          python tools/rfc.py close-run \
            --run-id REC-040-20260811T045909Z \
            --result PASS \
            --closeout runs/REC-040-20260811T045909Z/CLOSEOUT.md

          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Repository controller produced no changes.'
            exit 1
          fi
          git commit -m 'Close governed REC-040 run'
          git push origin HEAD:agent/4rfc-universe-build
