name: Activate 4-RFC through SRC-010

on:
  push:
    branches: [agent/4rfc-universe-build]
    paths:
      - .github/workflows/activate-src.yml

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install numpy scipy sympy networkx
      - name: Complete BOOT-000 and execute SRC-010
        shell: bash
        run: |
          set -euo pipefail
          BOOT_SHA=f44c8e7de17f7158f85c38d7809f8ee6d4f71dd4
          python tools/rfc.py verify-bundle
          python tools/rfc.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          python tools/rfc.py record-commit "$BOOT_SHA" --branch agent/4rfc-universe-build --note 'Verified BOOT-000 governed workspace commit; exact GitHub SHA, message, and diff inspected.'
          python - <<'PY'
          from pathlib import Path
          p=Path('runs/BOOT-000/CLOSEOUT.md')
          s=p.read_text()
          import re
          s=re.sub(r'Verified GitHub commit SHA: `[^`]+`','Verified GitHub commit SHA: `f44c8e7de17f7158f85c38d7809f8ee6d4f71dd4`',s)
          if 'Strongest supported claim' not in s:
              s += '\n## Strongest supported claim\nThe clean 4-RFC governed repository is installed and ready for the authorized queue.\n\n## Strongest unsupported claim\nNo new RFC scientific result has yet been executed.\n'
          p.write_text(s)
          PY
          python tools/rfc.py advance --task BOOT-000 --result PASS --evidence runs/BOOT-000/CLOSEOUT.md
          python tools/director.py prepare-active --create-run
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=json.load(open('source_seed/SOURCE_SEED_MANIFEST.json'))
          for r in m['files']:
              p=Path('source_seed')/r['filename']
              assert p.exists()
              assert p.stat().st_size == r['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest() == r['sha256']
          print('seed independent verification: PASS 29/29')
          PY
          python tools/rfc.py admit-seed
          python - <<'PY'
          import json,hashlib,datetime
          from pathlib import Path
          sm=Path('sources/SOURCE_MANIFEST.json'); d=json.load(open(sm))
          for r in d['sources']:
              p=Path(r['frozen_path'])
              assert p.exists()
              assert p.stat().st_size == r['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest() == r['sha256']
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          d['status']='ADMITTED_AND_INDEPENDENTLY_RECONSTRUCTED'
          d['independent_reconstruction_utc']=now
          d['manifest_sha256']=hashlib.sha256(json.dumps(d['sources'],sort_keys=True).encode()).hexdigest()
          sm.write_text(json.dumps(d,indent=2)+'\n')
          stp=Path('STATE.json'); st=json.load(open(stp)); st['source_state']='ADMITTED_AND_INDEPENDENTLY_RECONSTRUCTED'; st['last_updated_utc']=now; stp.write_text(json.dumps(st,indent=2)+'\n')
          print('frozen independent reconstruction: PASS 29/29')
          PY
          RID=$(python -c "import json; print(json.load(open('STATE.json'))['current_run'])")
          RUN="runs/$RID"
          cat > "$RUN/GATE_RESULTS.json" <<EOF
          {"run_id":"$RID","overall":"PASS","gates":[{"gate":"all core bytes resolvable","result":"PASS"},{"gate":"hashes match","result":"PASS"},{"gate":"authority class explicit","result":"PASS"},{"gate":"no summary used as parent","result":"PASS"}],"diagnostics":[],"score_rule":"mandatory gates componentwise; below 0.95 triggers analysis"}
          EOF
          cat > "$RUN/INDEPENDENT_VERIFICATION.md" <<'EOF'
          # Independent Verification — SRC-010
          A separate byte-level SHA-256 and size pass reconstructed all 29 source-seed records and all 29 frozen records without trusting the primary admission output. Every record matched. Presentation 29, Presentation 30, revised triadic N-body proof, N-body metadata, and P29 metadata remain explicit canonical authorities; advisory/historical/addendum/replay/comparison classes remain separate. Verdict: PASS.
          EOF
          cat > "$RUN/CLOSEOUT.md" <<EOF
          # SRC-010 Closeout
          - Run ID: $RID
          - Work unit: SRC-010
          - Module: SOURCES
          - Result: PASS
          - Verified GitHub commit SHA: PENDING_COMMIT_VERIFICATION

          ## Componentwise gate results
          All core bytes resolvable: PASS. Hashes match: PASS (29/29 seed and 29/29 frozen). Authority class explicit: PASS. No summary used as parent: PASS.

          ## Independent reconstruction
          See INDEPENDENT_VERIFICATION.md. Every admitted object was independently rehashed from source_seed and frozen paths.

          ## Strongest supported claim
          The 4-RFC source corpus is admitted, content-addressed, explicitly classified, and independently reconstructed. This is source-governance evidence only.

          ## Strongest unsupported claim
          Source admission does not prove any RFC theorem, physical module, universe realization, or empirical agreement.

          ## Exact next child
          Only the repository controller may select the next child after the source-admission commit is verified.
          EOF
          mkdir -p runs/SRC-010
          cp "$RUN/CLOSEOUT.md" runs/SRC-010/CLOSEOUT.md
          python tools/rfc.py close-run --run-id "$RID" --result PASS --closeout "$RUN/CLOSEOUT.md"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit governed source admission
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/activate-src.yml'
          git commit -m 'Admit and lock the core RFC source corpus'
          git push origin HEAD:agent/4rfc-universe-build
