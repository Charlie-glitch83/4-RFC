name: Governed Active Module Step

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repository-step:
    if: github.event.pull_request.head.ref == 'agent/4rfc-universe-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy networkx scipy sympy
      - name: Refresh sole-authorized D-130 packet and freeze preparation
        shell: bash
        run: |
          set -euo pipefail
          RUN='D-130-20260811T165602Z'
          RUN_DIR="modules/D/runs/$RUN"
          bash tools/start_work.sh
          cat work_packets/ACTIVE_WORK_PACKET.md
          grep -q 'ACTIVE WORK PACKET — D-130' work_packets/ACTIVE_WORK_PACKET.md
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('modules/D/runs/D-130-20260811T165602Z/PRE_EXECUTION_LOCK.json')
          status=json.loads(p.read_text(encoding='utf-8')).get('status')
          print('D_PRELOCK_STATUS', status)
          PY
          if ! grep -q '"status": "FROZEN"' "$RUN_DIR/PRE_EXECUTION_LOCK.json"; then
            python "$RUN_DIR/D130_PREPARE.py"
          fi
          grep -q '"status": "FROZEN"' "$RUN_DIR/PRE_EXECUTION_LOCK.json"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python tools/rfc.py firewall-scan
      - name: Commit frozen D-130 preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore memory/CURRENT_CONTEXT.md || true
          git add modules/D/runs/D-130-20260811T165602Z work_packets/ACTIVE_WORK_PACKET.md STATE.json memory/RUN_INDEX.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'D-130: freeze parent-derived transport preparation'
          git fetch origin agent/4rfc-universe-build
          git rebase origin/agent/4rfc-universe-build
          git push origin HEAD:agent/4rfc-universe-build
