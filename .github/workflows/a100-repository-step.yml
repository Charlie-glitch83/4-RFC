name: A100 Repository Step

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repository-step:
    if: github.event.pull_request.head.ref == 'agent/4rfc-universe-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy networkx scipy sympy
      - name: Run frozen A-100 gates
        shell: bash
        run: |
          set -euo pipefail
          RUN='A-100-20260811T115001Z'
          RUN_DIR="modules/A/runs/$RUN"
          python "$RUN_DIR/A100_VERIFY.py"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit repository-produced gate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/A/runs/A-100-20260811T115001Z
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A-100: execute frozen countermodels replay and independent audit'
          git push origin HEAD:agent/4rfc-universe-build
