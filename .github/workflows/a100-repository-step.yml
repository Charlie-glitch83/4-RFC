name: Governed Active Module Step

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repository-step:
    if: github.event.pull_request.head.ref == 'agent/4rfc-universe-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy networkx scipy sympy
      - name: Execute frozen B-110 symbolic records reference checks and physical engine
        shell: bash
        run: |
          set -euo pipefail
          RUN='B-110-20260811T140258Z'
          RUN_DIR="modules/B/runs/$RUN"
          python tools/director.py wolfram-record --run "$RUN" --call B-WL-001 --output "$RUN_DIR/wolfram_raw/B-WL-001.recorder.txt"
          python tools/director.py wolfram-record --run "$RUN" --call B-WL-002 --output "$RUN_DIR/wolfram_raw/B-WL-002.recorder.txt"
          python tools/run_reference_checks.py --module B --output "$RUN_DIR/reference_checks.json"
          test -f "$RUN_DIR/solver_templates/B_big_implosion.template.json"
          test -f "$RUN_DIR/binding_sheets/B_big_implosion.bindings.json"
          python tools/materialize_solver_config.py --template "$RUN_DIR/solver_templates/B_big_implosion.template.json" --binding-sheet "$RUN_DIR/binding_sheets/B_big_implosion.bindings.json" --output "$RUN_DIR/solver_configs/B_big_implosion.json"
          python tools/run_configured_solver.py --config "$RUN_DIR/solver_configs/B_big_implosion.json" --output-dir "$RUN_DIR/solver_outputs/big_implosion"
          python tools/rfc.py doctor
          python tools/director.py doctor
      - name: Commit B-110 primary execution evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'B-110: execute frozen Big Implosion primary state'
          git fetch origin agent/4rfc-universe-build
          git rebase origin/agent/4rfc-universe-build
          git push origin HEAD:agent/4rfc-universe-build
