name: Governed E-140 Source Prelock Audit

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  e140-source-audit:
    if: github.event.pull_request.head.ref == 'agent/4rfc-universe-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy networkx scipy sympy
      - name: Run authoritative E-140 source and prelock audit
        shell: bash
        run: |
          set -euo pipefail
          RUN='E-140-20260811T175023Z'
          RUN_DIR="modules/E/runs/$RUN"
          bash tools/start_work.sh
          cat work_packets/ACTIVE_WORK_PACKET.md
          grep -q 'ACTIVE WORK PACKET — E-140' work_packets/ACTIVE_WORK_PACKET.md
          python tools/rfc.py doctor
          python tools/director.py doctor
          python tools/rfc.py firewall-scan
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          root=Path('.')
          run=root/'modules/E/runs/E-140-20260811T175023Z'
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          handoff=root/'modules/D/runs/D-130-20260811T165602Z/H_D_to_E.json'
          manifest=root/'sources/SOURCE_MANIFEST.json'
          candidates=[]
          for p in (root/'sources/frozen').glob('*/*'):
              if p.is_file() and p.suffix.lower() in {'.md','.txt','.json'}:
                  text=p.read_text(encoding='utf-8',errors='ignore')
                  if re.search(r'(?i)reaction|stoich|nucleosynth|BBN|rate law|cross section|species', text):
                      candidates.append({'path':str(p),'sha256':sha(p),'bytes':p.stat().st_size})
          report={
            'run_id':'E-140-20260811T175023Z',
            'classification':'E_SOURCE_ADMISSION_PRELOCK_AUDIT',
            'active_packet_verified':True,
            'exact_parent':{'path':str(handoff),'sha256':sha(handoff)},
            'source_manifest_sha256':sha(manifest),
            'candidate_text_sources':candidates,
            'public_data_used':False,
            'decision':'REQUIRES_EXACT_SOURCE_OWNED_SPECIES_STOICHIOMETRY_AND_RATE_LAWS_BEFORE_FREEZE'
          }
          (run/'E140_SOURCE_ADMISSION_AUDIT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - name: Commit E-140 source audit only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore memory/CURRENT_CONTEXT.md || true
          git add modules/E/runs/E-140-20260811T175023Z/E140_SOURCE_ADMISSION_AUDIT.json work_packets/ACTIVE_WORK_PACKET.md || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'E-140: audit exact source-owned reaction inputs'
          git fetch origin agent/4rfc-universe-build
          git rebase origin/agent/4rfc-universe-build
          git push origin HEAD:agent/4rfc-universe-build
