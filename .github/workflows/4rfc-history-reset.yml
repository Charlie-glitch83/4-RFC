name: Establish 4-RFC clean history

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify clean identity and replace reachable history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          forbidden=['3-RFC','3RFC_Execution_Ready_Universe_Builder_20260805','Charlie-glitch83/3-RFC','agent/3rfc-universe-build','3rfc-universe-build']
          hits=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts: continue
              if p.suffix.lower() in {'.zip','.pdf','.docx'}: continue
              try:s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:continue
              if any(x in s for x in forbidden):hits.append(str(p))
          if hits: raise SystemExit('identity contamination: '+', '.join(hits))
          print('identity precheck: PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan 4rfc-clean-root
          git add -A
          git commit -m 'Initialize clean 4-RFC root'
          git push --force origin HEAD:main
