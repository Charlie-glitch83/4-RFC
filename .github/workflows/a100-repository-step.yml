name: Governed Active Module Step

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repository-step:
    if: github.event.pull_request.head.ref == 'agent/4rfc-universe-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy networkx scipy sympy
      - name: Finalize and close D-130 through repository commands
        shell: bash
        run: |
          set -euo pipefail
          RUN='D-130-20260811T165602Z'
          RUN_DIR="modules/D/runs/$RUN"
          bash tools/start_work.sh
          grep -q 'ACTIVE WORK PACKET — D-130' work_packets/ACTIVE_WORK_PACKET.md
          PYTHONPATH=. python "$RUN_DIR/D130_VERIFY.py"
          PYTHONPATH=. python "$RUN_DIR/D130_FINALIZE.py"
          python tools/rfc.py promote-module D --to FORMALIZED --fidelity MINIMAL_SPINE --evidence "$RUN_DIR/PRE_EXECUTION_LOCK.json"
          python tools/rfc.py promote-module D --to IMPLEMENTED --fidelity MINIMAL_SPINE --evidence "$RUN_DIR/solver_configs/D_transport.json"
          python tools/rfc.py promote-module D --to VERIFIED --fidelity MINIMAL_SPINE --evidence "$RUN_DIR/GATE_RESULTS.json"
          python tools/rfc.py promote-module D --to PHYSICALLY_EXECUTED --fidelity MINIMAL_SPINE --evidence "$RUN_DIR/THERMAL_TRANSPORT_STATE.json"
          python tools/rfc.py promote-module D --to INDEPENDENTLY_REPRODUCED --fidelity MINIMAL_SPINE --evidence "$RUN_DIR/INDEPENDENT_VERIFICATION.md"
          python tools/rfc.py promote-module D --to FROZEN --fidelity MINIMAL_SPINE --evidence "$RUN_DIR/H_D_to_E.json"
          python tools/rfc.py record-claim --file "$RUN_DIR/CLAIM_RECORD.json"
          python tools/rfc.py close-run --run-id "$RUN" --result PASS --closeout "$RUN_DIR/CLOSEOUT.md"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit closed D-130
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore memory/CURRENT_CONTEXT.md || true
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Close Module D at its verified scientific scope'
          git fetch origin agent/4rfc-universe-build
          git rebase origin/agent/4rfc-universe-build
          git push origin HEAD:agent/4rfc-universe-build
