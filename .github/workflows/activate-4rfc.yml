name: Governed 4-RFC transition

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository runtime
        run: python -m pip install numpy scipy sympy networkx
      - name: Advance verified AUTH-020
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE=$(python - <<'PY'
          import json
          print(json.load(open('STATE.json'))['active_work_unit'])
          PY
          )
          if [ "$ACTIVE" != "AUTH-020" ]; then
            echo "Controller already moved to $ACTIVE; no duplicate transition."
            exit 0
          fi
          python - <<'PY'
          import json
          s=json.load(open('STATE.json'))
          runs=json.load(open('memory/RUN_INDEX.json')).get('runs',[])
          ok=any(r.get('run_id')=='AUTH-020-20260811T044245Z' and r.get('status')=='PASS' for r in runs)
          if s.get('current_run') is not None or not ok:
              raise SystemExit('AUTH-020 is not in closed PASS state')
          PY
          python tools/rfc.py record-commit 27b250a0d70f429b59184dfc01b2a812cff26d45 --branch agent/4rfc-universe-build --note 'Externally verified AUTH-020 scientific-constitution lock commit and diff.'
          python tools/rfc.py advance --task AUTH-020 --result PASS --evidence runs/AUTH-020-20260811T044245Z/CLOSEOUT.md
          bash tools/start_work.sh
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/activate-4rfc.yml' ':!.github/workflows/4rfc-boot-transition.yml' ':!.github/workflows/src010-governed.yml'
          if git diff --cached --quiet; then
            echo 'No state transition changes to commit.'
            exit 0
          fi
          git commit -m 'Advance governed queue after AUTH-020'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
