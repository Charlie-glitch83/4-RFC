name: A100 Repository Step

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repository-step:
    if: github.event.pull_request.head.ref == 'agent/4rfc-universe-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy networkx scipy sympy
      - name: Finalize and close A-100 through repository commands
        shell: bash
        run: |
          set -euo pipefail
          RUN='A-100-20260811T115001Z'
          RUN_DIR="modules/A/runs/$RUN"
          python "$RUN_DIR/A100_VERIFY.py"
          python "$RUN_DIR/A100_FINALIZE.py"
          python tools/rfc.py promote-module A --to FORMALIZED --fidelity PRODUCTION --evidence "$RUN_DIR/PRE_EXECUTION_LOCK.json"
          python tools/rfc.py promote-module A --to VERIFIED --fidelity PRODUCTION --evidence "$RUN_DIR/GATE_RESULTS.json"
          python tools/rfc.py promote-module A --to INDEPENDENTLY_REPRODUCED --fidelity PRODUCTION --evidence "$RUN_DIR/INDEPENDENT_VERIFICATION.md"
          python tools/rfc.py promote-module A --to FROZEN --fidelity PRODUCTION --evidence "$RUN_DIR/H_A_to_B.json"
          python tools/rfc.py record-claim --file "$RUN_DIR/CLAIM_RECORD.json"
          python tools/rfc.py close-run --run-id "$RUN" --result PASS --closeout "$RUN_DIR/CLOSEOUT.md"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit closed A-100
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Close Module A at its verified scientific scope'
          git fetch origin agent/4rfc-universe-build
          git rebase origin/agent/4rfc-universe-build
          git push origin HEAD:agent/4rfc-universe-build
