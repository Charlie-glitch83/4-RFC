name: 4-RFC BOOT transition

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository runtime
        run: python -m pip install numpy scipy sympy networkx
      - name: Record and advance BOOT
        shell: bash
        run: |
          set -euo pipefail
          python tools/rfc.py record-commit d9a6e6d31e0b3c247dc7be83b703493bcce80e48 --branch agent/4rfc-universe-build --note 'Verified BOOT-000 governed workspace commit.'
          printf '\n- Verified BOOT commit: `d9a6e6d31e0b3c247dc7be83b703493bcce80e48`\n' >> runs/BOOT-000/CLOSEOUT.md
          python tools/rfc.py advance --task BOOT-000 --result PASS --evidence runs/BOOT-000/CLOSEOUT.md
          bash tools/start_work.sh
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Advance 4-RFC bootstrap to source admission'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
