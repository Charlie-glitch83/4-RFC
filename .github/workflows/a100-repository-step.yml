name: Governed Active Module Step

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repository-step:
    if: github.event.pull_request.head.ref == 'agent/e140-source-audit-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy networkx scipy sympy
      - name: Record E-140 source-law underdetermination
        shell: bash
        run: |
          set -euo pipefail
          RUN='E-140-20260811T175023Z'
          RUN_DIR="modules/E/runs/$RUN"
          bash tools/start_work.sh
          cat work_packets/ACTIVE_WORK_PACKET.md
          grep -q 'ACTIVE WORK PACKET — E-140' work_packets/ACTIVE_WORK_PACKET.md
          grep -q '"status": "BLOCKED_UNDERDETERMINED"' "$RUN_DIR/PRE_EXECUTION_LOCK.json"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          run=root/'modules/E/runs/E-140-20260811T175023Z'
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          hp=root/'modules/D/runs/D-130-20260811T165602Z/H_D_to_E.json'
          mp=root/'sources/SOURCE_MANIFEST.json'
          parent_sha=sha(hp)
          manifest_sha=sha(mp)
          assert parent_sha=='79a8f4d5e06558d1114ccd3af832d92344c5d47a075f1f0b708a19ccfc6a59db'
          audit=json.loads((run/'E140_SOURCE_ADMISSION_AUDIT.json').read_text(encoding='utf-8'))
          assert audit['status']=='BLOCKED_UNDERDETERMINED'
          for key in ['source_owned_species_graph','source_owned_rate_laws','source_owned_rate_uncertainty']:
              assert audit['determination'][key] is False
          assert audit['determination']['manufactured_example_admissible_as_physical_parent'] is False
          lock=json.loads((run/'PRE_EXECUTION_LOCK.json').read_text(encoding='utf-8'))
          assert lock['status']=='BLOCKED_UNDERDETERMINED'
          assert lock['parent_hashes']==[parent_sha]
          example=root/'configured_runs/examples/E_reaction_network.json'
          frozen_example=root/'configured_runs/results/E_reaction_network/frozen_config.json'
          assert example.read_bytes()==frozen_example.read_bytes()
          inspected=[]
          for rec in audit['inspected_objects']:
              if rec['classification']=='MANUFACTURED_EXAMPLE_NOT_SCIENTIFIC_PARENT':
                  continue
              inspected.append({'path':rec['path'],'sha256':rec['sha256'],'classification':rec['classification'],'admission_role':'INSPECTED_NOT_GENERATIVE_FOR_E_RATE_LAW'})
          source_register={
            'run_id':'E-140-20260811T175023Z',
            'exact_parents':[{'path':str(hp),'sha256':parent_sha,'kind':'EXACT_FROZEN_D_TO_E_HANDOFF'}],
            'admitted_sources':inspected,
            'imports':[],
            'files':['recipes/E/WORK_ORDER.md','recipes/E/recipe.json','sources/SOURCE_MANIFEST.json','configured_runs/templates/E_reaction_network.template.json'],
            'urls':[],
            'constants':[],
            'public_data_declaration':'NONE',
            'source_law_status':'UNDERDETERMINED_BEFORE_PRE_EXECUTION_FREEZE',
            'missing_required_objects':['source-owned species and reaction graph','executable source-owned rate laws','rate-law uncertainty state'],
            'manufactured_example_status':'REJECTED_AS_NON_PARENT_EXAMPLE_FIXTURE'
          }
          (run/'SOURCE_REGISTER.json').write_text(json.dumps(source_register,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          blocked={
            'run_id':'E-140-20260811T175023Z',
            'classification':'BLOCKED_UNDERDETERMINED',
            'stage':'PRE_EXECUTION_DEFINITION_AND_LOCK',
            'exact_parent':{'path':str(hp),'sha256':parent_sha},
            'source_manifest':{'path':str(mp),'sha256':manifest_sha},
            'pre_execution_lock_status':'BLOCKED_UNDERDETERMINED_NOT_FROZEN',
            'source_admission_audit_sha256':sha(run/'E140_SOURCE_ADMISSION_AUDIT.json'),
            'missing_objects':['source-owned species/reaction graph','executable source-owned rate laws and uncertainty'],
            'manufactured_fixture':{'path':str(example),'sha256':sha(example),'decision':'REJECTED_NOT_AN_ADMITTED_PARENT_OR_DERIVATION'},
            'proxy_closeout_decision':'Prior BBN proxy and observational comparison ledgers are comparison or methodological evidence only and are not generation inputs.',
            'generation_mode':'GENERATION_SEALED',
            'public_inputs_used':False,
            'wolfram_calls_executed':False,
            'reaction_solver_executed':False,
            'earliest_affected_object':'E source-owned reaction-law definition before PRE_EXECUTION_LOCK',
            'strongest_supported_claim':'Module D remains frozen at its verified MINIMAL_SPINE scope; Module E has verified its exact parent but has not established an executable source-owned reaction law.',
            'strongest_unsupported_claim':'No primordial isotope abundance state, E reaction-network execution, or E-to-F handoff is established.',
            'required_resolution':'Admit or derive exact source-owned species, stoichiometry, executable rate laws, and uncertainty without observational target fitting before any E pre-execution freeze.'
          }
          (run/'E140_BLOCKED_UNDERDETERMINED.json').write_text(json.dumps(blocked,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          existing=(run/'FAILURES.jsonl').read_text(encoding='utf-8') if (run/'FAILURES.jsonl').exists() else ''
          marker='Exact admitted parent/source bytes do not yet establish the executable source-owned reaction graph and rate laws required to freeze E-140.'
          if marker not in existing:
              with (run/'FAILURES.jsonl').open('a',encoding='utf-8') as f:
                  f.write(json.dumps({'classification':'BLOCKED_UNDERDETERMINED','stage':'PRE_EXECUTION_DEFINITION_AND_LOCK','description':marker,'changes_frozen_science':False,'public_inputs_used':False})+'\n')
          print(json.dumps(blocked,indent=2))
          PY
          grep -q '"active_work_unit": "E-140"' STATE.json
          grep -q '"project_status": "ACTIVE"' STATE.json
          grep -q '"status": "BLOCKED_UNDERDETERMINED"' "$RUN_DIR/PRE_EXECUTION_LOCK.json"
          python tools/rfc.py doctor
          python tools/director.py doctor
          python -m unittest discover -s tests -v
          python tools/rfc.py firewall-scan
      - name: Commit E-140 governed block evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore memory/CURRENT_CONTEXT.md || true
          git add -A modules/E/runs/E-140-20260811T175023Z || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'E-140: record source-law underdetermination'
          git fetch origin agent/4rfc-universe-build
          git rebase origin/agent/4rfc-universe-build
          git push origin HEAD:agent/4rfc-universe-build
