name: A100 Repository Step

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repository-step:
    if: github.event.pull_request.head.ref == 'agent/4rfc-universe-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/4rfc-universe-build
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy networkx scipy
      - name: Run exact repository solver commands
        shell: bash
        run: |
          set -euo pipefail
          RUN='A-100-20260811T115001Z'
          RUN_DIR="modules/A/runs/$RUN"
          python tools/director.py solver-copy --module A --solver triad_kernel --destination "$RUN_DIR"
          python tools/materialize_solver_config.py --template "$RUN_DIR/solver_templates/A_triad_kernel.template.json" --binding-sheet "$RUN_DIR/binding_sheets/A_triad_kernel.bindings.json" --output "$RUN_DIR/solver_configs/A_triad_kernel.json"
          python tools/run_configured_solver.py --config "$RUN_DIR/solver_configs/A_triad_kernel.json" --output-dir "$RUN_DIR/solver_outputs/triad_kernel"
          python tools/director.py doctor
      - name: Commit repository-produced records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/A/runs/A-100-20260811T115001Z
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'A-100: execute provenance-bound triad kernel'
          git push origin HEAD:agent/4rfc-universe-build
