name: XWALK firewall corrective

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Preserve failure and correct token boundaries
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE=$(python -c "import json; print(json.load(open('STATE.json'))['active_work_unit'])")
          if [ "$ACTIVE" != "XWALK-030" ]; then
            echo "Active work is $ACTIVE; corrective exits."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import json,datetime
          p=Path('tools/rfc.py')
          s=p.read_text()
          old='suspicious = re.compile(r"(planck|desi|pantheon|sh0es|best[-_ ]?fit|posterior|likelihood|public[_ -]?data)", re.I)'
          new='suspicious = re.compile(r"(?<![A-Za-z0-9_])(planck|desi|pantheon|sh0es|best[-_ ]?fit|posterior|likelihood|public[_ -]?data)(?![A-Za-z0-9_])", re.I)'
          if old in s:
              p.write_text(s.replace(old,new))
          elif new not in s:
              raise SystemExit('firewall regex anchor not found')
          run=Path('runs/XWALK-030-20260811T045240Z')
          rec={'failure_id':'XWALK-030-FIREWALL-TOKENIZATION-'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ'),'run_id':'XWALK-030-20260811T045240Z','gate':'post-run repository validation','category':'INFRASTRUCTURE_GUARDRAIL_STALE','description':'The mechanical firewall used an unbounded DESI token and false-matched the legitimate evidence-state word DESIGN inside XWALK independent verification. XWALK scientific gates had passed before this post-run check.','earliest_affected_object':'tools/rfc.py firewall suspicious-token regular expression','changes_frozen_science':False,'required_replay_scope':'XWALK-030 full frozen gate matrix and repository suite','strongest_claim_remaining':'XWALK-030 remains active until complete rerun passes','timestamp_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          with (run/'FAILURES.jsonl').open('a') as f: f.write(json.dumps(rec)+'\n')
          PY
          python tools/rfc.py firewall-scan
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/rfc.py runs/XWALK-030-20260811T045240Z/FAILURES.jsonl
          git commit -m 'Fix firewall token boundaries for governed evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
